name: inventory_app
description: "نظام إدارة مخازن مياه رواء - Rawaa WMS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local Database (Offline-First)
  sqflite: ^2.4.1
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Localization, Date/Time & Numbers
  intl: ^0.20.2

  # Document Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # File Sharing & Backup Picking
  share_plus: ^10.1.4
  file_picker: ^8.1.7

  # Typography & Arabic Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
